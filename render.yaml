services:
  - type: web
    name: ecotrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --locked
    startCommand: uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_COOKIE_PATH
        value: /api/backend/auth
